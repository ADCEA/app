<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ma tournée — Blanchisserie Cézanne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16324F; --brand:#1D91FF; --brand-deep:#0F6FCB;
  --steel:#64798D; --steel-light:#AFC0CF; --bg:#F5F8FC; --paper:#FFFFFF;
  --line:#DEE6EE; --teal:#2FB27A; --rust:#E0574B;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom, 24px);
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px;}

/* ---------- en-tête ---------- */
header{background:var(--ink);color:#fff;padding:22px 16px 26px;}
header .wrap{padding:0 16px;}
header .eyebrow{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#8FB4D9;margin:0 0 4px;}
header h1{font-family:'Fredoka',sans-serif;font-size:26px;font-weight:600;margin:0 0 2px;}
header .date{font-size:13px;color:#B7CEE6;}

/* ---------- carte météo ---------- */
.weather-card{
  background:var(--paper); border-radius:12px; margin:-16px 0 16px;
  box-shadow:0 8px 24px rgba(22,50,79,0.12); overflow:hidden;
}
.weather-main{display:flex;align-items:center;gap:14px;padding:16px 18px;}
.weather-icon{width:44px;height:44px;flex-shrink:0;}
.weather-info{flex:1;}
.weather-cond{font-family:'Fredoka',sans-serif;font-size:16px;font-weight:600;}
.weather-range{font-size:12.5px;color:var(--steel);margin-top:1px;}
.weather-detail{font-size:11px;color:var(--steel-light);margin-top:2px;}
.weather-danger{
  background:var(--rust); color:#fff; padding:10px 18px;
  font-size:12.5px; line-height:1.5;
}
.weather-danger div{padding:2px 0;}
.weather-danger .dtitle{font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:0.05em;margin-bottom:4px;opacity:0.9;}
.weather-ok{background:var(--teal);color:#fff;padding:8px 18px;font-size:12px;font-weight:500;}

/* ---------- conseils sécurité ---------- */
.safety-strip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:18px;}
.safety-strip h3{font-family:'Fredoka',sans-serif;font-size:12.5px;margin:0 0 8px;color:var(--brand-deep);display:flex;align-items:center;gap:6px;}
.safety-strip ul{margin:0;padding:0;list-style:none;}
.safety-strip li{font-size:12px;color:var(--steel);padding:4px 0 4px 16px;position:relative;line-height:1.4;}
.safety-strip li::before{content:'';position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--brand);}

/* ---------- résumé tournée ---------- */
.route-summary{display:flex;gap:10px;margin-bottom:20px;}
.route-summary .stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
.route-summary .stat b{display:block;font-family:'Fredoka',sans-serif;font-size:22px;color:var(--ink);}
.route-summary .stat span{font-size:10.5px;color:var(--steel);text-transform:uppercase;letter-spacing:0.04em;}

/* ---------- ligne de parcours (élément signature) ---------- */
.route{position:relative;padding-left:38px;}
.route::before{
  content:''; position:absolute; left:15px; top:8px; bottom:8px; width:2px;
  background:repeating-linear-gradient(to bottom, var(--brand) 0 6px, transparent 6px 11px);
}
.stop{position:relative;margin-bottom:14px;}
.stop-num{
  position:absolute; left:-38px; top:0; width:32px; height:32px; border-radius:50%;
  background:var(--brand); color:#fff; font-family:'Fredoka',sans-serif; font-size:14px; font-weight:600;
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(29,145,255,0.35);
  z-index:1;
}
.stop-dist{font-size:10px;color:var(--steel-light);margin:-6px 0 6px 2px;}
.stop-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.stop-societe{font-family:'Fredoka',sans-serif;font-size:16px;font-weight:600;margin-bottom:2px;}
.stop-ticket{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel-light);margin-bottom:8px;}
.stop-addr{font-size:13px;color:var(--steel);margin-bottom:10px;line-height:1.4;}
.stop-actions{display:flex;gap:8px;margin-bottom:10px;}
.stop-actions a{
  flex:1; text-align:center; padding:9px; border-radius:8px; font-size:12.5px; font-weight:500;
  text-decoration:none; display:flex; align-items:center; justify-content:center; gap:5px;
}
.stop-actions .maps{background:var(--brand);color:#fff;}
.stop-actions .call{background:var(--bg);color:var(--ink);border:1px solid var(--line);}
.stop-actions .bl{background:var(--bg);color:var(--ink);border:1px solid var(--line);}
.stop-items{font-size:11.5px;color:var(--steel);border-top:1px solid var(--line);padding-top:8px;}
.stop-items span{display:inline-block;margin:2px 8px 2px 0;}
.comment-toggle{width:100%;margin-top:10px;padding:9px;border-radius:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:12.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:5px;}
.comment-box{display:none;margin-top:10px;}
.comment-box.open{display:block;}
.comment-box textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font-family:inherit;font-size:13px;resize:vertical;min-height:60px;box-sizing:border-box;}
.comment-box button{margin-top:6px;width:100%;padding:9px;border-radius:8px;background:var(--brand);color:#fff;border:none;font-size:12.5px;font-weight:500;}
.comment-sent{font-size:11.5px;color:var(--teal);font-weight:600;margin-top:6px;display:none;}
.comment-sent.show{display:block;}

.empty, .loading, .error{text-align:center;padding:60px 20px;color:var(--steel);font-size:14px;}
.error{color:var(--rust);}

footer{text-align:center;font-size:11px;color:var(--steel-light);padding:20px 16px 10px;}
</style>
</head>
<body>
<div id="app">
  <div class="loading">Chargement de votre tournée…</div>
</div>

<script>
const token = new URLSearchParams(window.location.search).get('token');
const app = document.getElementById('app');

const WEATHER_ICONS = {
  clear: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="5" fill="#F5A623"/><g stroke="#F5A623" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></g></svg>',
  cloud: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 18a4.5 4.5 0 010-9 5.5 5.5 0 0110.6 1.8A3.5 3.5 0 0117 18H7z" fill="#AFC0CF"/></svg>',
  rain: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 14a4.5 4.5 0 010-9 5.5 5.5 0 0110.6 1.8A3.5 3.5 0 0117 14H7z" fill="#8FB4D9"/><g stroke="#1D91FF" stroke-width="1.8" stroke-linecap="round"><path d="M8 17l-1.5 3M13 17l-1.5 3M18 17l-1.5 3"/></g></svg>',
  snow: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 13a4.5 4.5 0 010-9 5.5 5.5 0 0110.6 1.8A3.5 3.5 0 0117 13H7z" fill="#C8D9E8"/><g stroke="#1D91FF" stroke-width="1.6" stroke-linecap="round"><path d="M9 18v4M9 19l-1.5 1M9 19l1.5 1M15 18v4M15 19l-1.5 1M15 19l1.5 1"/></g></svg>',
  storm: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 13a4.5 4.5 0 010-9 5.5 5.5 0 0110.6 1.8A3.5 3.5 0 0117 13H7z" fill="#64798D"/><path d="M13 14l-3 5h2.5l-1.5 4 4.5-6h-2.5l1.5-3h-1.5z" fill="#E0574B"/></svg>',
  fog: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g stroke="#AFC0CF" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></g></svg>',
};
function iconFor(label){
  const l = label.toLowerCase();
  if (l.includes('orage')) return WEATHER_ICONS.storm;
  if (l.includes('neige') || l.includes('verglaçante')) return WEATHER_ICONS.snow;
  if (l.includes('brouillard')) return WEATHER_ICONS.fog;
  if (l.includes('pluie') || l.includes('bruine') || l.includes('averse')) return WEATHER_ICONS.rain;
  if (l.includes('dégagé')) return WEATHER_ICONS.clear;
  return WEATHER_ICONS.cloud;
}

function esc(s){ return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatDuration(totalMinutes){
  const h = Math.floor(totalMinutes / 60);
  const m = Math.round(totalMinutes % 60);
  return h > 0 ? `${h}h${String(m).padStart(2,'0')}` : `${m} min`;
}

async function load(){
  if (!token) {
    app.innerHTML = '<div class="error">Lien invalide — il manque le jeton d\'accès dans l\'adresse.</div>';
    return;
  }
  let data;
  try {
    const res = await fetch(`/api/driver-portal/${encodeURIComponent(token)}`);
    if (!res.ok) throw new Error((await res.json()).error || 'Erreur de chargement.');
    data = await res.json();
  } catch (err) {
    app.innerHTML = `<div class="error">${esc(err.message)}</div>`;
    return;
  }
  render(data);
}

function render(data){
  const dateLabel = new Date(data.date).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

  const w = data.weather;
  const weatherHtml = w ? `
    <div class="weather-card">
      <div class="weather-main">
        <div class="weather-icon">${iconFor(w.conditionLabel)}</div>
        <div class="weather-info">
          <div class="weather-cond">${esc(w.conditionLabel)}</div>
          <div class="weather-range">${w.tempMin}° – ${w.tempMax}°C</div>
          <div class="weather-detail">Pluie : ${w.precipitationMm} mm · Vent max : ${w.windMaxKmh} km/h</div>
        </div>
      </div>
      ${w.dangers.length > 0 ? `
        <div class="weather-danger">
          <div class="dtitle">⚠ Vigilance conduite</div>
          ${w.dangers.map(d => `<div>${esc(d)}</div>`).join('')}
        </div>
      ` : '<div class="weather-ok">✓ Rien à signaler côté météo aujourd\'hui.</div>'}
    </div>
  ` : '';

  const safetyHtml = `
    <div class="safety-strip">
      <h3>Rappels avant de démarrer</h3>
      <ul>${data.safetyTips.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
    </div>
  `;

  const totalStops = data.stops.length;

  if (totalStops === 0) {
    app.innerHTML = `
      <header><div class="wrap">
        <div class="eyebrow">Blanchisserie Cézanne</div>
        <h1>${esc(data.driverName)}</h1>
        <div class="date">${dateLabel}</div>
      </div></header>
      <div class="wrap">${weatherHtml}${safetyHtml}
        <div class="empty">Aucun arrêt pour le moment.<br>Revenez un peu plus tard.</div>
      </div>
      <footer>Blanchisserie Cézanne</footer>
    `;
    return;
  }

  const stopsHtml = data.stops.map((s, i) => `
    <div class="stop">
      <div class="stop-num">${s.sequence || i + 1}</div>
      ${i > 0 ? '' : ''}
      <div class="stop-card">
        <div class="stop-societe">${esc(s.societe)}</div>
        <div class="stop-ticket">${esc(s.ticket)}</div>
        <div class="stop-addr">${esc(s.adresse)}</div>
        <div class="stop-actions">
          <a class="maps" href="${s.mapsUrl}" target="_blank" rel="noopener">🧭 Itinéraire</a>
          ${s.tel ? `<a class="call" href="tel:${esc(s.tel)}">📞 Appeler</a>` : ''}
        </div>
        <div class="stop-actions">
          <a class="bl" href="${s.deliveryNoteUrl}" target="_blank" rel="noopener">📄 Bon de livraison</a>
        </div>
        <div class="stop-items">${s.items.map(it => `<span>${esc(it.name)} ×${it.qty}</span>`).join('')}</div>
        <button type="button" class="comment-toggle" data-comment-toggle="${s.orderId}">💬 Laisser un commentaire</button>
        <div class="comment-box" id="comment-box-${s.orderId}">
          <textarea id="comment-text-${s.orderId}" placeholder="Ex. Client absent, linge laissé à la réception. Ou : demande plus de serviettes la prochaine fois."></textarea>
          <button type="button" data-comment-send="${s.orderId}">Envoyer à l'équipe</button>
          <div class="comment-sent" id="comment-sent-${s.orderId}">✓ Message envoyé.</div>
        </div>
      </div>
    </div>
  `).join('');

  app.innerHTML = `
    <header><div class="wrap">
      <div class="eyebrow">Blanchisserie Cézanne</div>
      <h1>${esc(data.driverName)}</h1>
      <div class="date">${dateLabel}${data.vehicle ? ' · ' + esc(data.vehicle) : ''}</div>
    </div></header>
    <div class="wrap">
      ${weatherHtml}
      ${safetyHtml}
      <div class="route-summary">
        <div class="stat"><b>${totalStops}</b><span>Arrêt${totalStops > 1 ? 's' : ''}</span></div>
        ${data.routeSummary ? `
          <div class="stat"><b>${data.routeSummary.totalDistanceKm} km</b><span>Distance</span></div>
          <div class="stat"><b>${formatDuration(data.routeSummary.estimatedMinutes)}</b><span>Durée estimée</span></div>
        ` : ''}
      </div>
      ${!data.routeSummary ? '<p style="font-size:11.5px;color:var(--steel-light);margin:-12px 0 16px;">Distance et durée non disponibles — la tournée n\'a pas encore été optimisée côté admin.</p>' : ''}
      <div class="route">${stopsHtml}</div>
    </div>
    <footer>Blanchisserie Cézanne — bonne route</footer>
  `;

  document.querySelectorAll('[data-comment-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById(`comment-box-${btn.dataset.commentToggle}`).classList.toggle('open');
    });
  });
  document.querySelectorAll('[data-comment-send]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const orderId = btn.dataset.commentSend;
      const textarea = document.getElementById(`comment-text-${orderId}`);
      const text = textarea.value.trim();
      if (!text) return;
      btn.disabled = true;
      btn.textContent = 'Envoi…';
      try {
        const res = await fetch(`/api/driver-portal/${token}/orders/${orderId}/comment`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (!res.ok) throw new Error((await res.json()).error || 'Échec de l\'envoi.');
        textarea.value = '';
        const sentNote = document.getElementById(`comment-sent-${orderId}`);
        sentNote.classList.add('show');
        setTimeout(() => sentNote.classList.remove('show'), 3000);
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Envoyer à l'équipe";
      }
    });
  });
}

load();
</script>
</body>
</html>
